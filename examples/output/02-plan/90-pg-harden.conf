# pg-harden 0.3.0 — Änderungsplan, erzeugt 2026-10-24 21:06
# Automatisch erzeugter Vorschlag. Auswirkungen auf Anwendungen vor dem Ausführen in einer Testumgebung prüfen.
# Ohne Gewähr (MIT-Lizenz). Prüfergebnisse und Pläne sind Vorschläge: Befunde fachlich bewerten, jede Änderung selbst prüfen und vor dem Einsatz in Produktion testen. Ein Lauf ohne Befund heißt nur, dass die Regeln des Katalogs nichts gefunden haben — nicht, dass die Instanz sicher ist.
# Einbinden: am ENDE von postgresql.conf "include_dir = 'conf.d'" eintragen und diese Datei nach conf.d/ legen.
# Später gelesene Zeilen und Dateien mit höherer Nummer in conf.d überschreiben diese Datei.
# Zurücknehmen: Datei entfernen und Konfiguration neu laden; Parameter mit Neustart erst nach Neustart.
# Zeilen mit "#BESTÄTIGEN" sind bewusst auskommentiert: Auswirkung prüfen, dann freischalten.

# roles.allow_alter_system: ALTER SYSTEM ist gesperrt
#BESTÄTIGEN allow_alter_system = 'off'
# log.collector: Protokolle werden in Dateien oder an syslog geschrieben
#BESTÄTIGEN logging_collector = 'on'
# log.connections: Anmeldungen werden protokolliert
log_connections = 'on'
# log.disconnections: Sitzungsende wird protokolliert
log_disconnections = 'on'
# log.line_prefix: Protokollzeilen enthalten Zeit, Benutzer, Datenbank und Quelle
#BESTÄTIGEN log_line_prefix = '%m [%p] %q%u@%d from %r (%a) '
# log.statement_ddl: Strukturänderungen werden protokolliert
#BESTÄTIGEN log_statement = 'ddl'
# log.parameter_length: Parameterwerte werden nicht vollständig protokolliert
#BESTÄTIGEN log_parameter_max_length = '0'

# Neustart erforderlich für: logging_collector; alle übrigen: SELECT pg_reload_conf();
